[project]
name = "dance-match-lab"
version = "0.1.0"
description = "Prototype for comparing dance choreographies with MediaPipe landmarks and biomechanical features."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe==0.10.14",
    "numpy==2.2.6",
    "opencv-contrib-python==4.13.0.92",
    "pillow==12.1.1",
    "scipy==1.15.3",
]

[tool.uv]
package = false
